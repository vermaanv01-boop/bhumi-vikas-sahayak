services:
  # 1. Express Backend Web Service
  - type: web
    name: bhumi-vikas-sahayak-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: bhumi-vikas-sahayak-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
